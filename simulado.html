<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Simulado ENADE · ADS · Stela</title>
  <meta name="description" content="A janela do Simulado ENADE de ADS: a página da questão no PDF oficial do INEP e o cartão-resposta.">
  <meta name="robots" content="noindex">
  <link rel="icon" href="assets/img/favicon.ico" sizes="any">
  <script src="assets/js/placa.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mona+Sans:wdth,wght@100..125,400..900&family=Atkinson+Hyperlegible+Next:ital,wght@0,400;0,700;1,400&family=Atkinson+Hyperlegible+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="assets/css/estilo.css">
  <link rel="stylesheet" href="assets/css/neon.css?v=1">
  <link rel="stylesheet" href="assets/css/conta.css?v=4">
  <link rel="stylesheet" href="css/enade.css?v=2">
</head>
<body>
  <div class="sim-pagina">
    <!-- o topo da prova: título, relógio, salvamento e entregar (a barra comum do site não aparece aqui: é uma janela só para o simulado) -->
    <header class="sim-topo">
      <img src="assets/img/enade.svg?v=1" alt="" width="30" height="30">
      <h1 data-titulo>Simulado ENADE<small>carregando…</small></h1>
      <span class="sim-salvo" data-salvo aria-live="polite"></span>
      <span class="sim-relogio" data-relogio role="timer" aria-label="Tempo restante">--:--</span>
      <button type="button" class="botao contorno sim-cron" data-cron aria-pressed="false" hidden>⏱ Cronômetro</button>
      <button type="button" class="botao contorno" data-revisar hidden>Revisar e entregar</button>
      <span data-conta-lugar class="sim-conta"></span>
      <button type="button" id="btn-tema" aria-label="Mudar para o tema claro" class="botao contorno" style="padding:.35rem .6rem">
        <svg class="sol" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="lua" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M20.5 14.5A8.5 8.5 0 0 1 9.5 3.5a8.5 8.5 0 1 0 11 11Z"/></svg>
      </button>
      <button type="button" id="btn-fonte" aria-label="Aumentar o tamanho do texto" class="botao contorno" style="padding:.35rem .6rem">A+</button>
      <button type="button" id="btn-movimento" aria-pressed="false" class="botao contorno" style="padding:.35rem .6rem">
        <svg class="pausar" viewBox="0 0 24 24" width="16" height="16" fill="currentColor" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>
        <svg class="tocar" viewBox="0 0 24 24" width="16" height="16" fill="currentColor" aria-hidden="true"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.5-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5Z"/></svg>
        <span class="rotulo visualmente-oculto">Pausar animações</span>
      </button>
    </header>

    <main id="sim" tabindex="-1">
      <div class="sim-aviso-meio cartao" data-aviso>
        <h2>Soldando os componentes…</h2>
        <p>Preparando o seu simulado.</p>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="assets/js/conta.js?v=6" data-disciplina="enade-ads"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="js/areas.js?v=1"></script>
  <script src="js/simulado.js?v=3"></script>
</body>
</html>
